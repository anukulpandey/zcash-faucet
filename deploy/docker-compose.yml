# Runs the faucet behind Caddy (automatic HTTPS). Usage on the VM:
#   DOMAIN=<ip>.sslip.io GITHUB_CLIENT_ID=... docker compose up -d
services:
  faucet:
    image: ghcr.io/anukulpandey/zcash-faucet-server:latest
    restart: unless-stopped
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      DRIP_ZAT: ${DRIP_ZAT:-1000000}
      DAILY_CAP_ZAT: ${DAILY_CAP_ZAT:-100000000}
    volumes: ["./data:/data"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN} --to faucet:8080
    volumes: ["./caddy:/data"]
