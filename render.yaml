# One-click deploy on Render's free plan (no card). Render asks for the two secrets below.
services:
  - type: web
    name: zcash-faucet
    runtime: image
    image:
      url: ghcr.io/anukulpandey/zcash-faucet-server:latest
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: GITHUB_CLIENT_ID
        value: Ov23linDlmchxCCNh2jG
      - key: WALLET_SEED
        sync: false
      - key: WALLET_BIRTHDAY
        sync: false
